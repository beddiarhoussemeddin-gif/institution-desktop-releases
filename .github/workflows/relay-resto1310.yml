name: Relay accepted stable Resto 1.3.10 to draft only
on:
  workflow_dispatch:
    inputs:
      artifact_url:
        required: true
        type: string
permissions:
  contents: write
jobs:
  relay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify immutable acceptance archive and copy exact EXE to draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/relay-resto1310.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: resto1310-acceptance-metadata
          path: ${{ runner.temp }}/resto1310-acceptance-results.json
          retention-days: 30
